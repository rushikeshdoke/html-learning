<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
    <h3>Form to take user input using different input types</h3> <br><br>

    <form>



        <label for="email">Enter Your Mail:</label>
        <input type="text" id="email" placeholder="rushikehdoke@gmail.com">

        <br><br>

        <fieldset>
            <legend>Input Types</legend>
       <h6>Choose gender:</h6>
       
        <input type="radio" id="gender1" name="gender">
        <label for="gender1">Male</label>

        <input type="radio" id="gender2" name="gender">
        <label for="gender2">Female</label>

        <input type="radio" id="gender3" name="gender">
        <label for="gender3">Other</label>

        <br>
        <br>

        <label for="dob">Date of birth:</label>
        <input type="date" id="dob">

<br><br>
        <label for="sub">Choose Favourite Subject:</label>
        <select name="subject" id="sub" >
            <option value="math">Mathematics</option>
            <option value="chem">Chemistry</option>
        </select>

        </fieldset>
    </form>
</body>
</html>
